group = io.github.avrilfanomar.arc42ext
version = 0.1.0

# Target platform: IntelliJ IDEA 2025.3 (branch 253), also the lowest supported version.
# Pass -PplatformLocalPath=/path/to/ide to build against an installed IDE of the same branch instead of downloading one.
platformVersion = 2025.3.6.1

# The IDE provides the Kotlin standard library -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency = false

org.gradle.configuration-cache = true
org.gradle.caching = true
