name: Publish Plugin

# Publishes the IntelliJ plugin to JetBrains Marketplace. Run by hand only, after the first version
# has been uploaded manually -> implementations/intellij-plugin/PUBLISHING.md
on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Marketplace channel'
        required: true
        default: 'default'
        type: choice
        options:
          - default
          - beta
          - alpha
          - eap

jobs:
  publish:
    name: Publish to JetBrains Marketplace
    runs-on: ubuntu-latest
    permissions:
      contents: write

    defaults:
      run:
        working-directory: implementations/intellij-plugin

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Verify plugin
        run: ./gradlew test verifyPlugin

      # publishPlugin builds and signs the plugin first.
      - name: Publish plugin
        env:
          ORG_GRADLE_PROJECT_intellijPlatformPublishingToken: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
          ORG_GRADLE_PROJECT_pluginChannel: ${{ inputs.channel }}
          CERTIFICATE_CHAIN: ${{ secrets.PLUGIN_SIGNING_CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PLUGIN_SIGNING_PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PLUGIN_SIGNING_PASSWORD }}
        run: ./gradlew publishPlugin

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plugin-distribution
          path: implementations/intellij-plugin/build/distributions/*.zip
          retention-days: 30

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: implementations/intellij-plugin/build/distributions/*.zip
          generate_release_notes: true
